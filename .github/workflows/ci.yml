name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux x86_64
            backend: tch
            libtorch-url: https://github.com/second-state/libtorch-releases/releases/download/v2.7.1/libtorch-cxx11-abi-x86_64-2.7.1.tar.gz
            libtorch-archive: libtorch.tar.gz
          - os: ubuntu-24.04-arm
            name: Linux ARM64
            backend: tch
            libtorch-url: https://github.com/second-state/libtorch-releases/releases/download/v2.7.1/libtorch-cxx11-abi-aarch64-2.7.1.tar.gz
            libtorch-archive: libtorch.tar.gz
          - os: macos-latest
            name: macOS ARM64 (mlx)
            backend: mlx

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4
        if: matrix.backend == 'tch'

      - uses: actions/checkout@v4
        if: matrix.backend == 'mlx'
        with:
          submodules: recursive

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb1-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libasound2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Clean build state
        run: rm -f Cargo.lock && cargo clean

      - name: Download libtorch
        if: matrix.backend == 'tch'
        run: curl -Lo ${{ matrix.libtorch-archive }} "${{ matrix.libtorch-url }}"

      - name: Extract libtorch
        if: matrix.backend == 'tch'
        run: tar xzf ${{ matrix.libtorch-archive }}

      - name: Set linker flags (Linux only)
        if: matrix.backend == 'tch' && runner.os == 'Linux'
        run: echo "RUSTFLAGS=-C link-arg=-Wl,-rpath-link,${{ github.workspace }}/libtorch/lib -C link-arg=-Wl,-rpath,\$ORIGIN/libtorch/lib" >> "$GITHUB_ENV"

      - name: Cap libtorch CPU ISA to AVX2 (x86_64 only)
        if: matrix.backend == 'tch' && runner.arch == 'X64'
        run: |
          echo "DNNL_MAX_CPU_ISA=AVX2" >> "$GITHUB_ENV"
          echo "ATEN_CPU_CAPABILITY=avx2" >> "$GITHUB_ENV"

      - name: Build (tch)
        if: matrix.backend == 'tch'
        env:
          LIBTORCH: ${{ github.workspace }}/libtorch
          LIBTORCH_BYPASS_VERSION_CHECK: "1"
        run: cargo build --release

      - name: Build (mlx)
        if: matrix.backend == 'mlx'
        run: cargo build --release --no-default-features --features mlx

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HuggingFace tools
        run: pip install huggingface_hub transformers

      - name: Set library path (Linux)
        if: matrix.backend == 'tch' && runner.os == 'Linux'
        run: echo "LD_LIBRARY_PATH=${{ github.workspace }}/libtorch/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Download 0.6B model
        run: python3 -c "from huggingface_hub import snapshot_download; snapshot_download('Qwen/Qwen3-ASR-0.6B', local_dir='Qwen3-ASR-0.6B')"

      - name: Generate 0.6B tokenizer.json
        run: |
          python3 -c "
          from transformers import AutoTokenizer
          tok = AutoTokenizer.from_pretrained('Qwen3-ASR-0.6B', trust_remote_code=True)
          tok.backend_tokenizer.save('Qwen3-ASR-0.6B/tokenizer.json')
          print('Saved tokenizer.json')
          "

      - name: "[0.6B] Transcribe sample1 (English)"
        run: ./target/release/asr Qwen3-ASR-0.6B test_audio/sample1.wav

      - name: "[0.6B] Transcribe sample2 (English)"
        run: ./target/release/asr Qwen3-ASR-0.6B test_audio/sample2.wav

      - name: "[0.6B] Transcribe sample3 (Chinese)"
        run: ./target/release/asr Qwen3-ASR-0.6B test_audio/sample3.wav

      - name: "[0.6B] API server test"
        run: |
          ./target/release/asr-server --model-dir Qwen3-ASR-0.6B --port 8099 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -s http://localhost:8099/health > /dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8099/health | grep -q '"ok"'
          echo "Health check passed"
          curl -sf http://localhost:8099/v1/models | grep -q '"qwen3-asr"'
          echo "Models endpoint passed"
          RESULT=$(curl -sf -X POST http://localhost:8099/v1/audio/transcriptions -F file=@test_audio/sample1.wav)
          echo "Transcription result: $RESULT"
          echo "$RESULT" | grep -qi "thank you"
          echo "JSON transcription passed"
          RESULT=$(curl -sf -X POST http://localhost:8099/v1/audio/transcriptions -F file=@test_audio/sample1.wav -F response_format=text)
          echo "Text result: $RESULT"
          echo "$RESULT" | grep -qi "thank you"
          echo "Text transcription passed"
          RESULT=$(curl -sf -X POST http://localhost:8099/v1/audio/transcriptions -F file=@test_audio/sample1.wav -F response_format=verbose_json)
          echo "Verbose result: $RESULT"
          echo "$RESULT" | grep -q '"duration"'
          echo "Verbose JSON transcription passed"
          kill $SERVER_PID
          echo "All API tests passed"

      - name: Download 1.7B model
        run: python3 -c "from huggingface_hub import snapshot_download; snapshot_download('Qwen/Qwen3-ASR-1.7B', local_dir='Qwen3-ASR-1.7B')"

      - name: Generate 1.7B tokenizer.json
        run: |
          python3 -c "
          from transformers import AutoTokenizer
          tok = AutoTokenizer.from_pretrained('Qwen3-ASR-1.7B', trust_remote_code=True)
          tok.backend_tokenizer.save('Qwen3-ASR-1.7B/tokenizer.json')
          print('Saved tokenizer.json')
          "

      - name: "[1.7B] Transcribe sample1 (English)"
        run: ./target/release/asr Qwen3-ASR-1.7B test_audio/sample1.wav

      - name: "[1.7B] Transcribe sample2 (English)"
        run: ./target/release/asr Qwen3-ASR-1.7B test_audio/sample2.wav

      - name: "[1.7B] Transcribe sample3 (Chinese)"
        run: ./target/release/asr Qwen3-ASR-1.7B test_audio/sample3.wav

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: qwen3-asr-${{ matrix.name }}
          path: |
            target/release/asr
            target/release/asr-server
            target/release/gui
